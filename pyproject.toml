[project]
name = "asset-mapping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
lambda = [
    "requests>=2.33.1",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "boto3>=1.43.11"
]
infra = [
    "aws-cdk-lib>=2.200.0",
    "constructs>=10.0.0",
    "python-dotenv>=1.0.0",
]
dev = [
    {include-group = "lambda"},
    {include-group = "infra"},
]
